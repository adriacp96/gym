<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrenamientos Guiados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla 1: Selector de Ejercicios -->
    <div id="screen-selector" class="screen active">
        <div class="header">Mis Entrenamientos</div>
        <div class="workout-list" id="workout-list">
            <!-- Las tarjetas se generan automáticamente aquí con JavaScript -->
        </div>
    </div>

    <!-- Pantalla 2: Entrenamiento Activo -->
    <div id="screen-workout" class="screen">
        <div class="workout-container">
            
            <div class="workout-header" id="current-workout-title">Título del Entrenamiento</div>

            <div class="gif-placeholder" id="gif-container">
                <span id="gif-text">GIF / Video<br>(Sin archivo asignado)</span>
                <img id="exercise-gif" src="" alt="Ejercicio">
            </div>

            <div class="exercise-info">
                <div class="exercise-name" id="exercise-name">Preparación...</div>
                <div class="timer-main" id="timer-main">00</div>
                <div class="timer-total">Faltan: <span id="timer-total">00:00</span></div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="btn-pause">Pausar</button>
                <button class="btn btn-secondary" style="background-color: #333;" id="btn-exit">Salir</button>
            </div>
        </div>
    </div>

    <!-- Cargar primero los datos y luego la lógica -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
