<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Entrenos">
    <meta name="theme-color" content="#121212">
    <title>Entrenamientos Guiados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="screen-selector" class="screen active">
        <div class="top-bar">
            <div class="header-title">Entrenamientos</div>
            <button id="btn-sound" class="btn-sound">🔊 Sonido ON</button>
        </div>
        <div class="workout-list" id="workout-list"></div>
    </div>

    <div id="screen-workout" class="screen" style="position: relative;">
        
        <div id="ready-overlay" class="overlay-ready">
            <button id="btn-start-play" class="btn-play">▶ Empezar</button>
            <button id="btn-cancel-play" class="btn-cancel">Cancelar</button>
            <div id="countdown-display" class="countdown-text" style="display: none;">3</div>
        </div>

        <div class="workout-container">
            <div class="workout-header" id="current-workout-title">Título del Entrenamiento</div>
            <div class="content-wrapper">
                <div class="gif-placeholder" id="gif-container">
                    <span id="gif-text">GIF / Video<br>(Sin archivo asignado)</span>
                    <img id="exercise-gif" src="" alt="Ejercicio">
                </div>
                
                <div class="exercise-info">
                    <div class="exercise-name" id="exercise-name">Preparación...</div>
                    
                    <!-- NUEVO: Temporizador Circular -->
                    <div class="timer-circle-container">
                        <!-- Círculo base e indicador de segmentos -->
                        <svg viewBox="0 0 100 100" class="timer-svg">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6"></circle>
                            <!-- Aquí se inyectan los fragmentos de la rutina desde JS -->
                            <g transform="rotate(-90 50 50)" id="timer-segments"></g>
                            <!-- Sombra de progreso (avanza ocultando lo que ya pasó) -->
                            <g transform="rotate(-90 50 50)">
                                <circle id="timer-progress-shadow" cx="50" cy="50" r="45" fill="none" stroke="rgba(0,0,0,0.85)" stroke-width="8" stroke-dasharray="282.74" stroke-dashoffset="282.74"></circle>
                            </g>
                        </svg>
                        
                        <!-- Punto indicador giratorio en HTML puro para que no falle nunca en iOS -->
                        <div class="timer-indicator-wrapper" id="timer-indicator-wrapper">
                            <div class="timer-indicator-dot"></div>
                        </div>
                        
                        <!-- Textos dentro del círculo -->
                        <div class="timer-circle-content">
                            <div class="timer-main" id="timer-main">00</div>
                            <div class="timer-total" id="timer-total">00:00</div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="btn-pause">Pausar</button>
                <button class="btn btn-secondary exit" id="btn-exit">Salir</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
