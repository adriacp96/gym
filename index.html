<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Entrenos">
    <meta name="theme-color" content="#07070b">
    <title>Entrenamientos Guiados</title>
    <link rel="stylesheet" href="styles.css?v=14">
</head>
<body class="bg-default">

    <!-- Fondos de luz ambiental animados (Orbes) -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- Pantalla 1: Selector de Ejercicios -->
    <div id="screen-selector" class="screen active">
        <div class="top-bar">
            <div class="header-title">Entrenamientos</div>
            <button id="btn-sound" class="btn-sound">🔊 Sonido ON</button>
        </div>
        <div class="workout-list" id="workout-list"></div>
    </div>

    <!-- Pantalla 2: Entrenamiento Activo -->
    <div id="screen-workout" class="screen" style="position: relative;">
        
        <!-- Overlay limpio y centrado -->
        <div id="ready-overlay" class="overlay-ready">
            <button id="btn-start-play" class="btn-play">▶ Empezar</button>
            <button id="btn-cancel-play" class="btn-cancel">Cancelar</button>
            <div id="countdown-display" class="countdown-text" style="display: none;">3</div>
        </div>

        <div class="workout-container">
            <div class="workout-header">
                <span id="current-workout-title">Título del Entrenamiento</span> • <span id="step-counter">Ejercicio 1 / 8</span>
            </div>

            <div class="content-wrapper">
                <!-- Contenedor flotante sin recuadro con silueta dinámica SVG -->
                <div class="gif-placeholder" id="gif-container">
                    <span id="gif-text">Pulsa Play cuando estés listo</span>
                    
                    <div class="floating-figure-stage" id="floating-figure-stage">
                        <svg id="png-outline-svg" class="png-outline-svg" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- Filtro que extrae el contorno exacto de la silueta PNG -->
                                <filter id="silhouette-stroke" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
                                    <feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="dilated"/>
                                    <feComposite in="dilated" in2="SourceAlpha" operator="out" result="ring"/>
                                    <feGaussianBlur in="ring" stdDeviation="1.4" result="glow"/>
                                    <feMerge>
                                        <feMergeNode in="glow"/>
                                        <feMergeNode in="ring"/>
                                    </feMerge>
                                </filter>
                                <mask id="silhouette-mask">
                                    <image id="mask-png-img" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" filter="url(#silhouette-stroke)"/>
                                </mask>
                            </defs>

                            <!-- Silueta tenue base (lo ya consumido) -->
                            <g mask="url(#silhouette-mask)">
                                <rect x="0" y="0" width="100%" height="100%" fill="rgba(255, 255, 255, 0.16)"/>
                                <!-- Barrido dinámico sincronizado con el tiempo restante -->
                                <foreignObject x="0" y="0" width="100%" height="100%">
                                    <div id="silhouette-progress-fill" class="silhouette-progress-fill"></div>
                                </foreignObject>
                            </g>
                        </svg>

                        <img id="exercise-gif" src="" alt="Ejercicio">
                    </div>
                </div>
                
                <div class="exercise-info">
                    <div class="exercise-name" id="exercise-name">Preparación...</div>
                    
                    <!-- Vista previa del siguiente ejercicio -->
                    <div class="next-preview">Siguiente: <span id="next-exercise-name">Plancha alta (60s)</span></div>
                    
                    <!-- Círculo doble moderno -->
                    <div class="timer-circle-container">
                        <svg viewBox="0 0 220 220" class="timer-svg">
                            <defs>
                                <linearGradient id="grad-active" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#00F2FE" />
                                    <stop offset="100%" stop-color="#0A84FF" />
                                </linearGradient>
                                <linearGradient id="grad-rest" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FF9500" />
                                    <stop offset="100%" stop-color="#FF2D55" />
                                </linearGradient>
                                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="3" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>
                            </defs>

                            <circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"></circle>
                            <g transform="rotate(-90 110 110)" id="timer-segments" filter="url(#glow)"></g>
                            <circle cx="110" cy="110" r="78" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"></circle>

                            <g transform="rotate(-90 110 110)">
                                <circle id="step-progress-ring" cx="110" cy="110" r="78" fill="none" 
                                    stroke="url(#grad-active)" stroke-width="10" stroke-linecap="round"
                                    stroke-dasharray="490.09" stroke-dashoffset="0" filter="url(#glow)"></circle>
                            </g>
                        </svg>
                        
                        <div class="timer-indicator-wrapper" id="timer-indicator-wrapper">
                            <div class="timer-indicator-dot"></div>
                        </div>
                        
                        <div class="timer-circle-content">
                            <div class="timer-main" id="timer-main">00</div>
                            <div class="timer-total" id="timer-total">00:00</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" id="btn-prev" style="color: #5AC8FA; font-weight: bold;">⏮ Ant.</button>
                <button class="btn btn-secondary" id="btn-pause">Pausar</button>
                <button class="btn btn-secondary" id="btn-next" style="color: #5AC8FA; font-weight: bold;">Sig. ⏭</button>
                <button class="btn btn-secondary exit" id="btn-exit">Salir</button>
            </div>
        </div>
    </div>

    <script src="data.js?v=14"></script>
    <script src="app.js?v=14"></script>
</body>
</html>
